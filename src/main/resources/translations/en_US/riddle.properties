feature.riddle.already_solved=<yellow>You already solved today's riddle.</yellow>
feature.riddle.in_progress=<yellow>A riddle is already in progress.</yellow>

feature.riddle.timer=<yellow>Time remaining: <gold>%s</gold></yellow>

feature.riddle.dialog.start.title=Daily Riddle
